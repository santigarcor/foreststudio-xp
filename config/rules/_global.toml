# --- evergreen_swap (template only; not copied into a region's rules) ---
# Regions with evergreen_only = true (e.g. the tropics, where XP12's season maps can put
# highlands in "winter") get these evergreen types instead of the seasonal ones above.
[evergreen_swap]
"lib/vegetation/forests/mixed/temperate.for" = "lib/vegetation/forests/mixed/very_hot.for"
"lib/vegetation/forests/broadleaves/temperate.for" = "lib/vegetation/forests/mixed/very_hot.for"
"lib/vegetation/forests/mixed/cold.for" = "lib/vegetation/forests/mixed/very_hot.for"
"lib/vegetation/forests/mixed/cold_low.for" = "lib/g8/coni_sp_vhot_wet.for"
"lib/vegetation/forests/conifers/temperate.for" = "lib/g8/coni_vhot_wet.for"
"lib/vegetation/forests/conifers/cold.for" = "lib/g8/coni_sp_vhot_wet.for"
"lib/vegetation/forests/conifers/cold_low.for" = "lib/g8/sparse_tr_vhot_dry.for"
"lib/vegetation/forests/broadleaves/warm_dry.for" = "lib/vegetation/forests/broadleaves/hot_dry.for"
"lib/vegetation/forests/mixed/warm_dry.for" = "lib/vegetation/forests/mixed/hot_dry.for"
"lib/vegetation/forests/conifers/warm_dry.for" = "lib/vegetation/forests/conifers/hot_dry.for"
"lib/g8/broad_sp_tmp_wet.for" = "lib/g8/broad_sp_vhot_wet.for"
"lib/g8/broad_sp_tmp_dry.for" = "lib/g8/broad_sp_hot_sdry.for"
"lib/g8/mixed_sp_tmp_wet.for" = "lib/g8/mixed_sp_vhot_wet.for"
"lib/g8/mixed_sp_wrm_sdry.for" = "lib/g8/mixed_sp_hot_sdry.for"
"lib/g8/coni_sp_tmp_wet.for" = "lib/g8/coni_sp_vhot_wet.for"
"lib/g8/coni_sp_tmp_dry.for" = "lib/g8/coni_sp_hot_sdry.for"
"lib/g8/coni_sp_wrm_sdry.for" = "lib/g8/coni_sp_hot_sdry.for"
"lib/g8/shrb_tmp_wet.for" = "lib/g8/shrb_vhot_wet.for"
"lib/g8/shrb_tmp_dry.for" = "lib/g8/shrb_hot_dry.for"
"lib/g8/shrb_wrm_sdry.for" = "lib/g8/shrb_hot_sdry.for"
"lib/g8/orch_tmp_wet.for" = "lib/vegetation/trees/evergreen/kapok_tree_medium.for"
