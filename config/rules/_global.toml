# Default forest types for any region without hand-made rules (written for "{label}").
# Biomes follow the 14 RESOLVE Ecoregions 2017 biomes (`resolve_biomes`): every ecoregion of that
# biome gets these types unless a biome lists the ecoregion by name (`ecoregions`, which wins).
# Tropical biomes use the evergreen types tuned for Colombia; temperate, boreal and Mediterranean
# biomes use X-Plane's seasonal types (they change with the seasons, as the real forests do).
# Elevation bands are in metres. Edit everything in the app (Build → Forest types).
#
# A cell uses `dense` when its tree density >= sparse_below, otherwise `sparse`.
#
# climate = true: the biome picks X-Plane's own forest for each spot from the leaf type seen by
# satellite (conifers / broadleaves / mixed, Copernicus Land Cover 100 m) and the climate there
# (Köppen-Geiger 1 km: very cold … very hot, dry … rainforest), e.g. Florida pine flatwoods →
# lib/g8/coni_wrm_wet.for. Its elevation bands are then only used if the climate map is missing.
# Evergreen-only regions get the very-hot (evergreen) family of the same leaf type and moisture.

sparse_below = 0.45

# OSM single trees and tree rows.
single_tree = "lib/vegetation/forests/mixed/temperate.for"

# Scattered town trees (built-up / residential land) where a biome sets no `town_tree`.
town_tree = "lib/vegetation/forests/mixed/temperate.for"

# Plantations from OpenStreetMap: first matching rule wins; match = key=value, & joins
# conditions; asset = "" means no trees.

[[plantation]]
name = "oil_palm"
label = "Oil palm"
color = [230, 120, 40]
match = ["trees=oil_palms", "genus=Elaeis", "crop=palm_fruit", "crop=oil_palm", "produce=palm_oil"]
asset = "lib/vegetation/trees/palm/date_palm_small.for"
density = 0.8

[[plantation]]
name = "coconut"
label = "Coconut palm"
color = [240, 200, 80]
match = ["trees=coconut_palms", "crop=coconut", "produce=coconut"]
asset = "lib/vegetation/trees/palm/coconut_palm_medium.for"
density = 0.7

[[plantation]]
name = "banana"
label = "Banana / plantain"
color = [200, 230, 60]
match = ["trees=banana_plants", "crop=banana", "crop=plantain", "produce=banana"]
asset = "lib/vegetation/trees/evergreen/banana_plant.for"
density = 0.7

[[plantation]]
name = "rubber"
label = "Rubber"
color = [120, 110, 200]
match = ["trees=rubber_trees", "genus=Hevea"]
asset = "lib/vegetation/trees/evergreen/kapok_tree_medium.for"
density = 0.6

[[plantation]]
name = "conifer"
label = "Conifer plantation / forest"
color = [70, 120, 160]
match = ["landuse=forest&leaf_type=needleleaved", "genus=Pinus", "genus=Picea", "trees=pine_trees"]
asset = "lib/vegetation/trees/coniferous/pine_medium.for"
density = 0.7

[[plantation]]
name = "eucalyptus"
label = "Eucalyptus"
color = [110, 170, 190]
match = ["genus=Eucalyptus", "trees=eucalyptus_trees"]
asset = "lib/vegetation/trees/evergreen/kapok_tree_thin.for"
density = 0.7

[[plantation]]
name = "no_trees"
label = "Crops without trees"
color = [200, 200, 200]
match = ["crop=sugarcane", "trees=pineapple_plants", "crop=pineapple", "crop=rice", "crop=corn",
  "crop=maize", "crop=soy", "crop=wheat", "crop=barley", "crop=rape", "crop=sunflower",
  "crop=potato", "crop=sugar_beet", "crop=grass", "crop=meadow"]
asset = ""
density = 0.0

[[plantation]]
name = "orchard"
label = "Orchards (fruit trees)"
color = [210, 90, 150]
match = ["landuse=orchard", "landuse=plantation"]
asset = "lib/g8/orch_tmp_wet.for"
density = 0.5

[[biome]]
name = "tropical_moist"
label = "Tropical moist forest"
color = [30, 140, 60]
ecoregions = []
climate = true
# RESOLVE's mangrove ecoregions reach far inland, so their land gets this biome; the real
# mangroves (WorldCover / OSM) use the "mangrove" biome below.
resolve_biomes = ["Tropical & Subtropical Moist Broadleaf Forests", "Mangroves"]
scrub = "lib/g8/shrb_vhot_rain.for"
town_tree = "lib/vegetation/forests/mixed/very_hot.for"
[[biome.band]]
name = "lowland"
elev_max = 1200
dense = "lib/g8/rainforest_vhot_rain.for"
sparse = "lib/g8/broad_sp_vhot_wet.for"
[[biome.band]]
name = "montane"
elev_max = 2800
dense = "lib/vegetation/forests/mixed/very_hot.for"
sparse = "lib/g8/mixed_sp_vhot_wet.for"
[[biome.band]]
name = "high"
elev_max = 9000
dense = "lib/g8/coni_sp_vhot_wet.for"
sparse = "lib/g8/sparse_tr_vhot_dry.for"

