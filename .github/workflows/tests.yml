name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:   # the release workflow runs the whole suite before it builds anything

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when called ("Release"), so a release never shares (or
  # cancels) the group of an ordinary push run; and a tag's run is never cancelled.
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: "3.11" }   # oldest supported
          - { os: windows-latest, python: "3.13" }   # main platform
          - { os: ubuntu-latest, python: "3.12" }    # symlink install + bundled Linux DSFTool
          - { os: macos-latest, python: "3.12" }     # symlink install + bundled macOS DSFTool
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        if: matrix.os == 'ubuntu-latest'   # once is enough; the rules don't depend on the OS
        run: python -m ruff check forest tests tools/package

      - name: "Tests (sandboxed: temp folders only, no X-Plane, no network)"
        run: python -m pytest -q -ra
