name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: "3.11" }   # oldest supported
          - { os: windows-latest, python: "3.13" }   # main platform
          - { os: ubuntu-latest, python: "3.12" }    # symlink install + bundled Linux DSFTool
          - { os: macos-latest, python: "3.12" }     # symlink install + bundled macOS DSFTool
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Tests (sandboxed: temp folders only, no X-Plane, no network)
        run: python -m pytest -q -ra
