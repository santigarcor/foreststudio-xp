[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foreststudio-xp"
dynamic = ["version"]
description = "ForestStudio XP: build X-Plane 12 forest overlays from land-cover, biome and OpenStreetMap data"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.2", "scipy>=1.15", "shapely>=2.1", "rasterio>=1.4", "pyproj>=3.7",
  "osmium>=4.0",      # reads the Geofabrik .osm.pbf extract
  "pyshp>=2.3",       # reads the RESOLVE ecoregions shapefile
  "psutil>=6.0",      # cores / RAM for parallel builds, peak memory per build
  "pywebview>=6.2",   # the desktop window (Edge WebView2 on Windows, WKWebView on macOS)
  # Linux: Qt WebEngine. The GTK backend needs PyGObject, which has no wheels and can't come from
  # the distro's python3-gi for the bundled Python of the release builds.
  "PyQt6>=6.7; sys_platform == 'linux'",
  "PyQt6-WebEngine>=6.7; sys_platform == 'linux'",
  "qtpy>=2.4; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
forest = "forest.cli:main"

[project.gui-scripts]
foreststudio-xp = "forest.app.main:main"

[tool.setuptools.packages.find]
include = ["forest*"]

[tool.setuptools.dynamic]
version = {attr = "forest.__version__"}

[tool.setuptools.package-data]
"forest.app" = ["ui/*", "ui/vendor/leaflet/*", "ui/vendor/leaflet/images/*", "icons/*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["tools/xptools"]

[tool.ruff.lint]
# pyflakes (unused imports/variables, undefined names), pycodestyle errors, import order, bugbear
select = ["F", "E", "W", "I", "B"]
ignore = [
  "E501",   # long lines: a few help texts and tables read better on one line
  "E402",   # imports after code: forest.build silences a rasterio warning before importing more
  "E731",   # lambda assignments: short local helpers (d = lambda m: ...) are intentional
  "B905",   # zip() without strict=: Python 3.11 support, zips are over equal-length data
]

[tool.ruff.lint.isort]
known-first-party = ["forest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::rasterio.errors.NotGeoreferencedWarning"]
markers = [
  "integration: slower tests that run the real pipeline on a small synthetic tile",
  "dsftool: compiles with the bundled DSFTool for this system",
]
